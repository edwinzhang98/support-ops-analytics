[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ops"
version = "1.0.0"
description = "Support ticket operations analytics: SLA root cause, Erlang C staffing model, roster optimization"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
